services:
  - type: web
    name: ahi-platform
    runtime: python
    plan: standard  # 2GB RAM — needed for parquet load + ONNX session + streamlit
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: STREAMLIT_SERVER_ENABLE_CORS
        value: "false"
      - key: STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION
        value: "false"
      # Streamlit runs each session on its own thread; glibc gives threads
      # separate malloc arenas that fragment and never shrink, so the process
      # ratchets upward. Capping arenas at 2 stops the ratchet.
      - key: MALLOC_ARENA_MAX
        value: "2"
    autoDeploy: true
