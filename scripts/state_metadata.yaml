# State metadata — single source of truth for state-aware data pipeline scripts
#
# Used by:
#   build_clean_labels_v3.py  — needs noaa_name, fips_state, county_fips_map
#   build_state.py            — orchestrator for one state's full pipeline
#   build_region.py           — orchestrator for all states in a region
#   download_gridmet.py       — uses bbox
#   download_usgs_earthquakes.py — uses bbox
#
# Fields:
#   fips_state    Two-digit FIPS state code (zero-padded)
#   noaa_name     STATE field value in NOAA Storm Events CSVs (uppercase)
#   wfigs_code    "US-XX" identifier in WFIGS POOState field
#   region        Strategy C region assignment (model.onnx folder name)
#   default_county Default county for app dashboard
#   county_count  Approximate; used for sanity checks
#   bbox          [lon_min, lat_min, lon_max, lat_max] — for GRIDMET / USGS downloads
#                 (slightly buffered beyond actual state extent to ensure full coverage)

