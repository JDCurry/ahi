# Reference NWS forecast offices that issue warnings for this state
nws_offices:
  - {code: BOU, name: "Boulder",       jurisdiction: "Front Range / NE plains"}
  - {code: PUB, name: "Pueblo",        jurisdiction: "S Colorado / SE plains"}
  - {code: GJT, name: "Grand Junction", jurisdiction: "Western Slope"}
  - {code: GLD, name: "Goodland",      jurisdiction: "NE corner / KS border"}

# State agencies referenced in HAZARD_GUIDANCE
state_agencies:
  emergency: "Colorado Division of Homeland Security and Emergency Management"
  fire:      "Colorado Division of Fire Prevention & Control"
  forestry:  "Colorado State Forest Service (CSFS)"
  transport: "CDOT"
  utility_regulator: "Colorado PUC"

# Per-hazard, per-tier operational guidance.
# Tiers: Low / Elevated / Moderate / High / Severe (matches RISK_TIERS in app.py)
hazard_guidance:
  fire:
    Low:      "Monitor fire weather outlook. Continue standard defensible-space inspection schedule."
    Elevated: "Review evacuation routes. Verify water supply access points at critical facilities. Monitor CSFS fire outlook."
    Moderate: "Coordinate with local fire districts on resource availability. Confirm mutual-aid agreements. Monitor Red Flag Watch criteria."
    High:     "Pre-position suppression resources. Stage air assets if available. Brief incident command structure. Alert at-risk populations in WUI zones."
    Severe:   "Activate operations. Implement evacuation protocols for WUI zones. Confirm shelter capacity. Coordinate with Colorado Division of Fire Prevention & Control."
  flood:
    Low:      "Routine monitoring of USGS stream gauges. Maintain standard drainage inspection cycle."
    Elevated: "Inspect drainage and culverts. Verify stream gauge telemetry. Review road closure plans for flood-prone corridors."
    Moderate: "Pre-stage pumps and sandbags at historically flood-prone areas. Brief CDOT on closure triggers. Monitor snowpack/SWE data."
    High:     "Deploy mobile pumps. Alert at-risk occupancies in floodplain. Coordinate with CDOT on State Highway closure triggers. Issue downstream warnings."
    Severe:   "Activate flood response. Execute pre-planned closures. Open shelters. Coordinate swiftwater rescue posture. Contact NWS BOU/PUB/GJT/GLD as appropriate."
  wind:
    Low:      "Routine monitoring. No special action required."
    Elevated: "Coordinate with utilities on line-inspection schedules. Secure outdoor equipment at critical facilities. Monitor Chinook watch criteria."
    Moderate: "Pre-position generators at critical facilities. Alert manufactured-housing communities and campgrounds. Brief utilities on potential outage response."
    High:     "Stage mutual-aid crews for utility response. Pre-position backup power. Review debris-management posture. Notify CDOT of potential road closures on exposed corridors."
    Severe:   "Activate operations. Coordinate widespread outage response. Confirm 911 redundancy and EOC staffing. Monitor I-70 mountain corridor and US-40 closures."
  winter:
    Low:      "Routine monitoring. Verify seasonal readiness of plowing and treatment supplies."
    Elevated: "Check backup power at warming shelters. Verify road-treatment supply levels. Monitor NWS winter storm outlook."
    Moderate: "Coordinate with CDOT on plowing priorities. Prepare travel-advisory messaging templates. Pre-position treatment supplies on priority routes."
    High:     "Open warming shelters as needed. Pre-position treatment supplies on priority routes. Issue travel advisories. Notify CDOT of potential Eisenhower/Johnson Tunnel closure conditions."
    Severe:   "Activate cold-weather response. Expand shelter capacity. Coordinate welfare checks on vulnerable populations. Expect extended highway closures on I-70 and high passes."
  seismic:
    Low:      "Baseline seismic risk. Maintain standard preparedness posture."
    Elevated: "Baseline seismic risk (geographic prior). Periodic review of structural assessments for critical facilities recommended."
    Moderate: "Baseline seismic risk. Confirm communications redundancy and SAR readiness on standard schedule. Note Front Range induced seismicity history."
    High:     "Baseline seismic risk. Note: AHI does not forecast individual seismic events — this value reflects geographic risk only. Cross-reference USGS hazard maps."
    Severe:   "Baseline seismic risk. Note: AHI does not forecast seismic events — see USGS for real-time hazard information. Review critical facility structural assessments."

# Plain-language seasonal context shown next to the date picker
season_notes:
  spring: "Spring — snowmelt flood season; late-season snow still possible"
  summer: "Summer — peak fire season; monsoon convective flooding (Jul–Aug)"
  fall:   "Fall — Chinook wind events; early winter storms at elevation"
  winter: "Winter — snow, blizzard, and Chinook downslope wind events"

# Audit factor explanations: (hazard, season) -> sentence
# Used in the per-prediction audit panel
audit_factors:
  fire:
    summer: "Peak fire season in Colorado — elevated fuel aridity following spring dryout and low relative humidity historically precede fire events in summer months, particularly on the Western Slope and eastern foothills."
    spring: "Spring fire transition — rapidly curing grasses and variable Chinook winds elevate fire potential in the foothills and eastern plains April–May."
    fall:   "Post-summer fuel loads and October dry periods can sustain fire risk on the eastern slopes and Front Range foothills before significant precipitation arrives."
    winter: "Winter fire risk is suppressed by the learned seasonal bias; this ranking reflects residual geographic patterns (wind-driven ignition risk, not fuel aridity)."
  flood:
    spring: "Spring snowmelt from the Rocky Mountains is Colorado's primary flood driver — historically the highest flood-rate period across the Front Range and mountain valleys, concentrated April–June."
    summer: "Colorado's monsoon season (July–August) drives convective flooding, particularly in the San Juan Mountains and southern Front Range; this is a secondary but significant flood peak distinct from spring snowmelt."
    fall:   "Post-monsoon and early-season storm transitions; elevated values may reflect late-season watershed saturation or rain-on-snow events at mid-elevation."
    winter: "Winter flood risk is generally low; elevated values may reflect rain-on-snow events at lower elevation or dam-controlled reservoir releases."
  wind:
    fall:   "Colorado's fall transition brings the onset of Chinook (downslope) winds to the Front Range — historically the first major high-wind events of the season along the I-25 corridor and foothills."
    winter: "Peak Chinook and downslope wind season — Front Range and foothill counties experience the most intense and sustained wind events November–March, with gusts regularly exceeding 70 mph."
    spring: "Spring high-wind season on the eastern plains — transition storm systems and strong thermal gradients produce some of the year's most frequent and damaging wind events."
    summer: "Summer wind risk is lower than the Chinook peak; elevated values may reflect convective-outflow winds or isolated severe thunderstorm activity on the eastern plains."
  winter:
    winter: "Peak winter storm season — the Front Range urban corridor and mountain counties face the highest risk of heavy snow, blizzard, and ice storm conditions December–February."
    fall:   "Early-season winter storm risk — Colorado's first significant snowstorms often arrive in October/November, particularly above 6,000 ft elevation along the Front Range."
    spring: "Late-season winter storm risk — March and April snowstorms are common in Colorado, frequently producing the heaviest single-storm totals of the year (wet, dense snow)."
    summer: "Summer winter storm risk is near-zero; the learned seasonal bias suppresses this head; value reflects residual calibration only."
  seismic:
    spring: "Seismic risk reflects geographic proximity to the Rocky Mountain Front Range fault systems and the history of induced seismicity — not weather conditions."
    summer: "Seismic risk reflects geographic proximity to the Rocky Mountain Front Range fault systems and the history of induced seismicity — not weather conditions."
    fall:   "Seismic risk reflects geographic proximity to the Rocky Mountain Front Range fault systems and the history of induced seismicity — not weather conditions."
    winter: "Seismic risk reflects geographic proximity to the Rocky Mountain Front Range fault systems and the history of induced seismicity — not weather conditions."

# Model performance for the About / Model Info tab
performance:
  mean_auc: 0.883
  per_hazard:
    winter:  {auc: 0.963, quality: Excellent, notes: "Best performer. Clear elevation gradient gives spatial mesh strong signal."}
    flood:   {auc: 0.891, quality: Excellent, notes: "Bimodal seasonal pattern (snowmelt + monsoon) well-captured."}
    seismic: {auc: 0.887, quality: Excellent, notes: "Front Range induced seismicity spatially tight → strong spatial signal."}
    fire:    {auc: 0.857, quality: Excellent, notes: "Western Slope + foothills WUI fire patterns learned well."}
    wind:    {auc: 0.817, quality: Excellent, notes: "Chinook corridor captured; high-plains diffuse wind harder to localize."}
  coupling_gate: 0.0934
  parameters: 1294547
  data_period: "2000–2025"
  data_sources:
    - "NOAA GridMET daily weather (CONUS)"
    - "WFIGS Wildland Fire Locations"
    - "USGS Earthquake Catalog"
    - "NOAA Storm Events Database"
    - "FEMA Disaster Declarations"

# Model + data version strings shown in audit reports and About page
versions:
  model: "AHI v2.5 (Colorado)"
  data:  "NOAA GridMET / WFIGS / USGS / NOAA Storm Events, 2000–2025"
